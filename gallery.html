<!DOCTYPE html>
<html lang="en">
<head>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;

header{
padding:60px 20px;
background:linear-gradient(to right,#0f172a,#1e293b);
}

}

h1{
